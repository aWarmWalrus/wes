# Golden set for the eval harness (docs/eval-design.md). Phase 1 fields:
#   id                  unique name; also the fixture filename
#   say                 sentence synthesized with piper and POSTed as the turn
#                       (special value SILENCE posts 1s of silence)
#   turns               instead of `say`: a list of utterances posted in order
#                       as one conversation (server memory); all `expect`
#                       checks and the judge apply to the LAST turn's reply.
#                       The runner resets server conversation memory before
#                       every case, so cases never leak into each other.
#   requires_pi         skip unless the Pi's :8090 answers (vision/status cases)
#   web_search          skip unless --web-search / WES_EVAL_WEB_SEARCH=1 (these
#                       hit the PAID web-search API — run weekly, not nightly)
#   expect:
#     transcript_includes  substrings the STT transcript must contain (case-insens)
#     reply_regex          must match the RE-TRANSCRIBED reply audio (case-insens);
#                          keep loose — it survives a whisper round-trip
#     min_audio_s / max_audio_s   spoken-reply length bounds (brevity checks)
#     max_total_ms         wall-clock bound for the whole turn (default 30000)
# Phase 3 will add exact `tools:` / `route:` assertions via X-Tools/X-Route
# headers; `judge:` is scored by Haiku from phase 2 on.

- id: time-basic
  say: "What time is it right now"
  expect:
    transcript_includes: [time]
    reply_regex: '\d{1,2}|o.?clock|morning|afternoon|evening'
    min_audio_s: 1.0
    max_audio_s: 15
  judge: "Does the reply state the current time plausibly and concisely?"

- id: date-today
  say: "What is the date today"
  expect:
    transcript_includes: [date]
    reply_regex: 'january|february|march|april|may|june|july|august|september|october|november|december'
    min_audio_s: 1.0
    max_audio_s: 15
  judge: "Does the reply state today's date?"

- id: greeting-brief
  say: "Hello there, how are you doing today"
  expect:
    transcript_includes: [hello]
    min_audio_s: 0.5
    max_audio_s: 15
  judge: "Is the reply a short, natural greeting with no invented facts?"

- id: capital-fact
  say: "What is the capital of France"
  expect:
    transcript_includes: [capital, france]
    reply_regex: 'paris'
    max_audio_s: 15
  judge: "Does the reply correctly say Paris, concisely?"

- id: math-simple
  say: "What is twelve plus thirteen"
  expect:
    reply_regex: '25|twenty.?five'
    max_audio_s: 15
  judge: "Does the reply correctly answer 25?"

- id: self-name
  say: "What is your name"
  expect:
    transcript_includes: [name]
    reply_regex: 'jarvis'
    max_audio_s: 15
  judge: "Does the assistant identify itself as Jarvis?"

- id: escalation-math
  say: >-
    A train leaves at three PM going sixty miles per hour, and a second train
    leaves at four PM going eighty miles per hour. At what time does the second
    train catch up to the first train
  expect:
    transcript_includes: [train]
    # whisper mangles a spoken "7:00 PM" wildly across runs: '7 0 0 p.m.',
    # '7-0-0-BM', 'seven'. Allow digits/colons/dots/hyphens between the 7 and the
    # meridiem, and accept the 'bm' mis-hearing of 'pm'. The judge confirms 7pm;
    # this just keeps the deterministic check from flaking on STT noise.
    reply_regex: 'seven|7[\s:0.\-]*(p\.?m\.?|pm|bm|o.?clock)'
    max_total_ms: 60000
    max_audio_s: 60
  judge: >-
    Correct answer is 7pm. Does the reply state it? (Working shown is fine
    but should be brief.)

# The escalation handoff must be INVISIBLE: the router must never announce it
# ("you should ask Claude...") or defer the question back to the user. Caught
# live 2026-07-05 — gemma spoke an announcement instead of calling the tool.
# Answering locally OR silently escalating both pass; naming Claude/the
# handoff, or telling the user to ask elsewhere, fails.
- id: escalation-silent
  say: "Prove that the square root of two is irrational"
  expect:
    transcript_includes: [square root]
    reply_not_regex: "claude|hand(ing)? (this |it )?off|ask (someone|somebody|them|him|her)|i can'?t answer|beyond (me|my)"
    max_total_ms: 60000
    max_audio_s: 90
  judge: >-
    Does the reply itself present a mathematical argument that the square root
    of two is irrational (any standard proof sketch counts), rather than
    deferring, refusing, or telling the user to ask something or someone else?

- id: robust-silence
  say: SILENCE
  expect:
    reply_regex: "didn't catch|did not catch|sorry"
    min_audio_s: 0.5
    max_audio_s: 10
  judge: "Does the assistant gracefully say it didn't hear anything?"

- id: brevity-open-ended
  say: "Tell me something interesting about the moon"
  expect:
    transcript_includes: [moon]
    reply_regex: 'moon|lunar'
    max_audio_s: 25
  judge: "Is the reply one or two natural spoken sentences about the moon?"

- id: lexicon-hailo
  say: "Is the Hailo accelerator busy right now"
  expect:
    # 'Hailo' is a homophone of 'Halo' — whisper may spell either even with
    # biasing (measured 2026-07-04); the router must understand regardless
    transcript_includes: [accelerator]
    max_audio_s: 20
  judge: >-
    Does the reply address the Hailo accelerator's status reasonably (a tool
    answer or honest uncertainty — not a mishearing of 'Hailo')?

- id: lexicon-names
  say: "Can you say hello to Kaia and Ellis for me"
  expect:
    transcript_includes: [kaia, ellis]
    reply_regex: 'kaia|ellis'
    max_audio_s: 15
  judge: "Does the reply greet Kaia and Ellis by name?"

# #002: WES has NO deferred actions, so any promise to act later is a promise it
# cannot keep. A turn must end with a real answer (or a real escalation) — never
# "I'll look into it and get back to you". The server-side unkept-promise guard
# re-runs such a turn at the deep tier; these cases are its regression net.
- id: promise-not-deferred
  say: "Explain the quadratic formula to a toddler"
  expect:
    transcript_includes: [quadratic]
    reply_not_regex: "get back to (you|ya)|let you know|look into (it|that|this)|i'?ll (find out|research|investigate|dig into)|give me a (moment|second|minute|sec)"
    max_total_ms: 60000
    max_audio_s: 60
  judge: >-
    Does the reply actually attempt a toddler-level explanation of the quadratic
    formula right now, rather than promising to look into it, find out, or get
    back to the user later?

# The multi-turn variant: an explicit "can you look into it?" is the strongest
# pull toward a deferral, because the user's own phrasing invites one.
- id: promise-not-deferred-followup
  turns:
    - "What is the Riemann hypothesis"
    - "Can you look into it and tell me why it matters"
  expect:
    transcript_includes: [look into]
    reply_not_regex: "get back to (you|ya)|let you know|i'?ll (find out|research|investigate|dig into)|give me a (moment|second|minute|sec)"
    max_total_ms: 60000
    max_audio_s: 90
  judge: >-
    The user asked the assistant to look into why the Riemann hypothesis
    matters. Does the reply explain why it matters NOW, rather than promising to
    investigate and report back later (which the assistant cannot actually do)?

- id: memory-recall
  turns:
    - "Please remember that my favorite color is purple"
    - "What is my favorite color"
  expect:
    # 'favo'/'colo': the British piper voice makes whisper spell these
    # favourite/colour — substrings must survive both spellings
    transcript_includes: [favo, colo]
    reply_regex: 'purple'
    max_audio_s: 15
  judge: >-
    Earlier in this conversation the user said their favorite color is purple.
    Does the reply correctly recall purple?

- id: pi-status
  say: "How is the Raspberry Pi doing right now"
  requires_pi: true
  expect:
    reply_regex: 'temperature|degrees|celsius|memory|load|fine|good|healthy'
    max_audio_s: 25
  judge: >-
    Does the reply report plausible live Pi status (temperature/memory/load)
    rather than guessing or refusing?

# Fantasy read (#029 P0): the reply must come from the fantasy_my_team tool, not
# invented players. Either a real roster or a graceful "needs connecting /
# couldn't reach Yahoo" is correct; making up named players/stats is the failure
# this guards.
#
# CHANGED 2026-07-29 (#033): this case used to say "basketball". Yahoo rolled the
# NBA season over and league nba.l.114020 stopped resolving, so the case began
# asserting against a league that no longer exists — a TRUE failure, not a flake.
# Repointed at FOOTBALL, where the owner has a real drafted roster. That also puts
# the NFL read path under nightly cover, which it otherwise lacked. Point this
# back at basketball once an NBA team is registered for the new season.
- id: fantasy-roster
  say: "What's on my fantasy football team right now"
  expect:
    # Generous on purpose. `reply` is the spoken reply transcribed BACK by
    # Whisper, so common words get mangled — an observed run said "Your TEEN
    # currently features Jalen hurt … Gemma Chase … Breeze Hole", i.e. team→teen,
    # Ja'Marr→Gemma, Breece Hall→Breeze Hole. The judge scored it 2/2 correct.
    # So the deterministic check only proves the reply is ABOUT a fantasy roster;
    # the judge is the real grader here (see #011 on STT eval flakes).
    reply_regex: 'roster|team|teen|fantasy|yahoo|sign|connect|reach|player|quarterback|receiv|back ?field|lineup'
    # Explicit budget (the 30s default is too tight, as for fantasy-value which
    # sets 50s): this case pays for a real headless-Chrome scrape AND then has the
    # 12b read back a 15-player roster. Measured 8-32s depending on how much of
    # the roster it reads aloud; the tool itself is only 4-5s. This case guards
    # GROUNDING — latency regressions belong to perf_check.py's tight threshold.
    max_total_ms: 50000
    max_audio_s: 25
  judge: >-
    The assistant HAS a real tool (fantasy_my_team) that reads the user's actual
    Yahoo fantasy roster live, so a reply listing specific players/scoring IS
    correct and grounded — do NOT treat named players as a hallucination. A
    graceful "I need to connect to Yahoo / couldn't reach it" is also correct.
    Mark incorrect only if it refuses, changes the subject, or invents something
    other than a roster (e.g. made-up stats it wasn't asked for).

# Lineup optimizer (#029 P2, tool registered 2026-07-29). Guards TWO things: that
# the recommendation comes from fantasy_optimize_lineup rather than being invented,
# and that the tool's missing-stats WARNING is passed through instead of dropped —
# a lineup built on partial data must not be relayed as certain.
# P3 executor (#029, tool registered 2026-07-30).
#
# REWRITTEN 2026-08-14. The original rubric asserted this tool "never writes to
# Yahoo" and marked the model INCORRECT for claiming a change. That was true in
# shadow mode and became FALSE once live writes shipped: the team runs
# `set_lineup: auto`, so the tool really does submit — meaning the eval was
# grading the model as wrong for honestly reporting a write it had just made,
# and was itself causing a real Yahoo write at 03:36 every eval night.
#
# The harness now sends `X-WES-No-Writes: 1` (see tests/stream_client.py), so
# this case exercises the executor's DRY-RUN path. What it guards is unchanged
# in spirit and now actually true: the reply must reflect what the tool
# reported, and must not overclaim.
- id: fantasy-propose
  say: "Check if my fantasy football team needs any lineup changes"
  expect:
    reply_regex: 'propose|log|start|bench|lineup|already|optimal|couldn.?t|connect|configured'
    max_total_ms: 60000
    max_audio_s: 40
  judge: >-
    The user asked to check for lineup changes. The assistant has a
    fantasy_propose_lineup_change tool that computes the optimal lineup and diffs
    it against the real roster. In this run writes are suppressed, so the tool
    reports what it WOULD do rather than doing it. Naming specific players/moves
    is correct and grounded, and "already optimal / no changes needed" is also
    correct. Mark INCORRECT if it invents players, or if it OVERCLAIMS relative
    to what the tool told it — asserting the Yahoo roster was actually changed
    when the tool reported a proposal or a would-be change. Reporting a real
    change IS correct when the tool says one happened; the failure being guarded
    is claiming an effect on a real account that the tool did not report.

- id: fantasy-lineup
  say: "Who should I start on my fantasy football team this week"
  expect:
    reply_regex: 'start|lineup|QB|WR|RB|TE|bench|roster|couldn.?t|connect'
    max_total_ms: 60000
    max_audio_s: 40
  judge: >-
    The user asked who to start. The assistant has a fantasy_optimize_lineup tool
    that computes the optimal lineup from the real roster, real player stats and
    the league's real scoring, so naming specific rostered players per slot IS
    correct and grounded — do NOT treat them as hallucinations. A graceful "no
    team configured / couldn't reach Yahoo / everyone is on a bye" is also
    correct. Mark INCORRECT if it invents players or point totals, refuses on the
    grounds that it cannot know the roster, or claims it CHANGED/SET the lineup on
    Yahoo (the tool only advises and never writes). If the tool reported missing
    stats for some players, a good reply mentions that caveat rather than
    presenting the lineup as certain.

# Web-search handoff (search_web → Haiku, #029 followup). GATED web_search: runs
# only with --web-search / WES_EVAL_WEB_SEARCH=1 (weekly), since it hits the paid
# web-search API. Verifies the router escalates a live-info query to the web
# instead of guessing from stale training data — and doesn't falsely claim it
# can't. Content is deliberately loose (weather is volatile); the judge carries it.
- id: web-weather
  say: "What is the weather in London right now"
  web_search: true
  expect:
    transcript_includes: [weather, london]
    reply_regex: 'degree|°|sunny|cloud|rain|clear|temperature|weather|forecast|warm|cool|cold|mild|humid|wind|couldn.?t|reach'
    max_total_ms: 45000
    max_audio_s: 30
  judge: >-
    The user asked for London's CURRENT weather, and the assistant has a live
    web-search tool. A good reply gives a plausible current weather report (a
    temperature and/or sky conditions) or says it couldn't reach live data right
    now. Mark it INCORRECT only if it refuses on the grounds that it has no
    internet access or can't know current conditions — it CAN look this up.

# Fantasy valuation (#029 P1): the reply must come from fantasy_player_value (a
# real stat line), not invented numbers. Uses the FREE ESPN stats feed (no paid
# API), so it runs nightly. Loose reply_regex (stat values vary); judge carries.
- id: fantasy-value
  say: "How good is Cam Thomas for my fantasy team this season"
  expect:
    reply_regex: 'point|rebound|assist|average|stat|per game|season|worth|start|couldn.?t|find'
    max_total_ms: 50000
    max_audio_s: 30
  judge: >-
    The user asked how good an NBA player is for fantasy. The assistant has a
    fantasy_player_value tool returning the player's real stat line, so a good
    reply cites plausible per-game stats (points/rebounds/assists) or gracefully
    says it couldn't find them. Mark INCORRECT only if it invents a stat line
    without looking it up, or refuses claiming it cannot know player stats.

# Schedule lookup (#028 option A): a forward-looking query no other NBA tool
# answers (nba_scores is today/dated only) — must come from nba_schedule
# (real season schedule), never a guessed date.
- id: nba-next-game
  say: "When do the Nets play next"
  expect:
    reply_regex: 'play|game|next|vs|against|couldn.?t|schedule|recognize'
    max_total_ms: 50000
    max_audio_s: 25
  judge: >-
    The user asked when the Brooklyn Nets next play. The assistant has an
    nba_schedule tool that reads the real season schedule, so a good reply
    names a real-sounding opponent and date/time, or gracefully says it
    couldn't find one (e.g. offseason with no schedule posted yet). Mark
    INCORRECT only if it invents a date without the tool, or refuses claiming
    it cannot know future games.

# Box-score aggregation (#028 option A, example 2): the "find the live game,
# then find the max stat" chain, done server-side in one tool call instead of
# needing the model to plan multiple steps.
- id: nba-top-performers
  say: "Who has the most points and rebounds in the Nets game right now"
  expect:
    # loose on-topic net only — the offseason "no game" reply is heavily
    # paraphrased run-to-run, so the JUDGE carries correctness, not the regex.
    reply_regex: 'point|rebound|lead|net|game|stat|play'
    max_total_ms: 50000
    max_audio_s: 25
  judge: >-
    The user asked who's leading in points/rebounds in the Nets' current game.
    The assistant has an nba_top_performers tool that reads the real box
    score, so a good reply names a player + a stat total for each category, or
    gracefully says the Nets have no game today (true in the NBA offseason).
    Mark INCORRECT only if it invents player names/stats without the tool.
