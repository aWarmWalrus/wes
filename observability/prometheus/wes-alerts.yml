# WES alert rules. Mounted into the Prometheus container at
# /etc/prometheus/rules/ by observability/docker-compose.yml; the Discord bot
# polls the firing set every minute and DMs the owner on fire/resolve
# (docs/observability.md). `summary` is the human sentence the DM shows — write
# it for a phone screen, and keep ALERT_CONTEXT in pc/wes_discord.py in sync.
#
# Apply after editing (no restart, no data loss):
#   curl -X POST http://127.0.0.1:9090/-/reload
# State: http://127.0.0.1:9090/alerts
#
# PiHot and PiDiskLow were removed 2026-09-02 with the Pi itself. EDiskLow is
# new in the same change: the Ollama model store moved to E: in the September
# migration, so that volume filling now stops the local model from loading at
# all — a failure the C: rule would not have seen.
groups:
  - name: wes
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        annotations:
          summary: >-
            Metrics from {{ $labels.job }} ({{ $labels.instance }}) have been
            missing for 5 minutes; the exporter or its host is down.

      - alert: GPUHot
        expr: nvidia_smi_temperature_gpu > 85
        for: 5m
        annotations:
          summary: "PC GPU has been over 85°C for 5 minutes (now {{ $value }}°C)."

      - alert: PCDiskLow
        expr: >-
          windows_logical_disk_free_bytes{volume="C:"} /
          windows_logical_disk_size_bytes{volume="C:"} < 0.10
        for: 30m
        annotations:
          summary: "The PC's C: drive is under 10% free space."

      - alert: EDiskLow
        expr: >-
          windows_logical_disk_free_bytes{volume="E:"} /
          windows_logical_disk_size_bytes{volume="E:"} < 0.10
        for: 30m
        annotations:
          summary: >-
            The PC's E: drive is under 10% free space — the Ollama models and
            the conda environment live there.
