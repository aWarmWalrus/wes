name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: Fast unit suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # `sleeperdraft` (the Sleeper draft-room DOM layer) is a public repo, so
      # pip clones it anonymously and this step needs no credentials. It was
      # briefly private, which needed a PAT in a secret and a git URL rewrite;
      # making it public deleted all of that.
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Collect by directory rather than listing test files, so a new
      # test_unit_*.py is covered the day it lands. (The version of this
      # workflow that sat unmerged on a branch listed four files by name and had
      # already fallen behind by four more.)
      #
      # The one exclusion is structural, not flaky:
      #   test_e2e.py — needs a live server + a real Claude API call (costs money)
      # Anything else that can't run here doesn't belong in the unit suite.
      # (test_faces.py used to be excluded too — it needed Pi hardware. The Pi
      # was retired 2026-09-02 and the file moved to archive/pi/, which pytest
      # never collects because this step names `tests/` explicitly.)
      # See tests/README.md.
      - name: Run unit tests
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_e2e.py

  # Guards the invariant that broke production for a week: the launcher env and
  # hosts.yaml must stay consistent with what the code actually reads. Cheap,
  # no deps beyond the dev set.
  registry:
    name: Host registry parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: hosts.yaml loads and exposes the PC
        run: |
          python -c "
          import wes_hosts
          wes_hosts.load(force=True)
          print(wes_hosts.summary())
          assert wes_hosts.ip('pc'), 'pc missing from hosts.yaml'
          assert wes_hosts.url('pc', 'server').startswith('http'), 'pc server url malformed'
          assert wes_hosts.url('pc', 'grafana').startswith('http'), 'pc grafana url malformed'
          "
