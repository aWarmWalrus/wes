name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    name: Fast unit suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # `sleeperdraft` (the Sleeper draft-room DOM layer) is a PRIVATE repo, and
      # the checkout's automatic GITHUB_TOKEN is scoped to this repository only,
      # so pip cannot clone it. SLEEPERDRAFT_TOKEN is a PAT with `repo` scope;
      # rewriting the URL prefix feeds it to git without putting it in
      # requirements-dev.txt, where it would be committed.
      #
      # If the secret is absent this is a no-op and the install fails loudly on
      # the clone rather than silently skipping a dependency the suite needs.
      # Making the package public would remove all of this.
      - name: Authenticate to the private sleeperdraft repo
        env:
          TOKEN: ${{ secrets.SLEEPERDRAFT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SLEEPERDRAFT_TOKEN is not set — pip cannot clone the"\
                 "private sleeperdraft repo and every test that imports"\
                 "wes_sleeper will fail. Add a PAT with 'repo' scope as a"\
                 "repository secret, or make the package public."
            exit 1
          fi
          git config --global url."https://${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Collect by directory rather than listing test files, so a new
      # test_unit_*.py is covered the day it lands. (The version of this
      # workflow that sat unmerged on a branch listed four files by name and had
      # already fallen behind by four more.)
      #
      # The two exclusions are structural, not flaky:
      #   test_e2e.py   — needs a live server + a real Claude API call (costs money)
      #   test_faces.py — needs Pi hardware; runs under the Pi's SYSTEM python3
      #                   (cv2 + hailo_platform), never under this venv
      # Anything else that can't run here doesn't belong in the unit suite.
      # See tests/README.md.
      - name: Run unit tests
        run: |
          python -m pytest tests/ -q \
            --ignore=tests/test_e2e.py \
            --ignore=tests/test_faces.py

  # Guards the invariant that broke production for a week: the launcher env and
  # hosts.yaml must stay consistent with what the code actually reads. Cheap,
  # no deps beyond the dev set.
  registry:
    name: Host registry parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - name: hosts.yaml loads and exposes both hosts
        run: |
          python -c "
          import wes_hosts
          wes_hosts.load(force=True)
          print(wes_hosts.summary())
          assert wes_hosts.ip('pc'), 'pc missing from hosts.yaml'
          assert wes_hosts.ip('pi'), 'pi missing from hosts.yaml'
          assert wes_hosts.url('pc', 'server').startswith('http'), 'pc server url malformed'
          "
